<head>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ================= BASE ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:radial-gradient(circle at top,#07152c,#02040b);
color:white;
overflow-x:hidden;
animation:fadeIn .6s ease forwards;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(15px);}
to{opacity:1; transform:translateY(0);}
}

/* ================= NAVBAR ================= */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 10%;
background:#0b0f1a;
position:fixed;
top:0;
left:0;
width:100%;
z-index:9999;
box-shadow:0 2px 15px rgba(0,0,0,0.6);
}

.logo{
font-size:22px;
font-weight:600;
}
.logo span{color:#00f2ff;}

.nav-links{
list-style:none;
display:flex;
gap:26px;
}

.nav-links a{
color:white;
text-decoration:none;
position:relative;
}

.nav-links a::after{
content:"";
position:absolute;
width:0;
height:2px;
background:#00f2ff;
left:0;
bottom:-6px;
transition:.3s;
}

.nav-links a:hover::after{
width:100%;
}

.menu-toggle{
display:none;
font-size:26px;
color:#00f2ff;
cursor:pointer;
}

/* ================= RESUME SECTION ================= */

.resume-section{
padding:120px 10% 80px;
text-align:center;
}

.resume-section h1{
font-size:42px;
margin-bottom:8px;
}

.resume-section p{
color:#aaa;
margin-bottom:30px;
}

/* BUTTONS */

.resume-actions{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:35px;
}

.download-btn,
.open-btn{
padding:11px 26px;
border-radius:30px;
font-weight:600;
text-decoration:none;
transition:.3s;
}

.download-btn{
background:#00f2ff;
color:black;
}

.open-btn{
border:1px solid #00f2ff;
color:#00f2ff;
}

.download-btn:hover{
box-shadow:0 0 20px #00f2ff;
}

.open-btn:hover{
background:#00f2ff;
color:black;
}

/* ================= RESUME VIEWER ================= */

.resume-viewer{
width:100%;
height:760px;
border-radius:18px;
overflow:hidden;
background:rgba(255,255,255,0.03);
border:1px solid rgba(0,255,255,0.25);
box-shadow:0 0 40px rgba(0,255,255,0.25);
position:relative;
}

/* glowing border */

.resume-viewer::before{
content:"";
position:absolute;
inset:-2px;
border-radius:18px;
background:linear-gradient(90deg,#00f2ff,transparent,#00f2ff);
filter:blur(12px);
z-index:-1;
}

.resume-viewer iframe{
width:100%;
height:100%;
border:none;
}

/* ================= FOOTER ================= */

footer{
margin-top:90px;
padding:25px 10%;
background:#070b14;
text-align:center;
border-top:1px solid rgba(0,255,255,0.2);
}

footer p{
color:#aaa;
font-size:14px;
}

footer span{color:#00f2ff;}

/* ================= MOBILE ================= */

@media(max-width:768px){

.menu-toggle{
display:block;
}

.nav-links{
position:absolute;
top:65px;
right:0;
background:#0b0f1a;
width:220px;
flex-direction:column;
padding:20px;
gap:18px;
display:none;
border-left:2px solid #00f2ff;
}

.nav-links.active{
display:flex;
}

.resume-viewer{
height:520px;
}

.resume-section{
padding:90px 6% 60px;
}

.resume-section h1{
font-size:32px;
}

}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<header>

</ul>

<i class="fas fa-bars"></i>
</div>

</nav>
</header>

</a>
</div>

<div class="resume-viewer">
<iframe src="resume\Sharath_Kumar_N( DATASCIENCE & AI ).pdf"></iframe>
</div>

</section>

<footer>

</footer>

document.querySelector(".nav-links").classList.toggle("active");
}
</script>

</body>
</html>
