href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:radial-gradient(circle at top left,#003f44,#05070d 55%);
color:#fff;
animation:fadeIn .6s ease forwards;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

/* ================= NAVBAR ================= */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 10%;
background:#0b0f1a;
position:fixed;
top:0;
left:0;
width:100%;
z-index:9999;
box-shadow:0 2px 15px rgba(0,0,0,0.6);
}

.logo{
font-size:22px;
font-weight:600;
}
.logo span{color:#00f2ff;}

.nav-links{
list-style:none;
display:flex;
gap:25px;
}

.nav-links a{
color:white;
text-decoration:none;
transition:.3s;
}
.nav-links a:hover{color:#00f2ff;}

.menu-toggle{
display:none;
font-size:26px;
color:#00f2ff;
cursor:pointer;
}

/* ================= CONTACT SECTION ================= */

.contact-section{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:90px 20px 60px;
}

/* Glass Card */

.contact-box{
max-width:420px;
width:100%;
background:rgba(15,20,35,0.85);
backdrop-filter:blur(12px);
padding:38px 32px;
border-radius:22px;
text-align:center;
box-shadow:
0 0 35px rgba(0,255,255,0.25),
inset 0 0 15px rgba(0,255,255,0.15);
transition:.4s;
}

.contact-box:hover{
transform:translateY(-6px);
box-shadow:0 0 55px rgba(0,255,255,0.45);
}

/* Heading */

.contact-box h1{
font-size:30px;
margin-bottom:8px;
color:#00f2ff;
}

.contact-box p{
color:#bbb;
font-size:14px;
margin-bottom:26px;
}

/* ================= FLOATING SOCIAL ICONS ================= */

@keyframes float{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

.social-icons{
display:flex;
justify-content:center;
gap:16px;
margin-bottom:26px;
flex-wrap:wrap;
}

.social-icons a{
width:44px;
height:44px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
background:#000;
color:#00f2ff;
font-size:18px;
box-shadow:0 0 15px #00f2ff;
transition:.4s;
animation:float 3s ease-in-out infinite;
}

.social-icons a:nth-child(1){animation-delay:0s;}
.social-icons a:nth-child(2){animation-delay:.2s;}
.social-icons a:nth-child(3){animation-delay:.4s;}
.social-icons a:nth-child(4){animation-delay:.6s;}
.social-icons a:nth-child(5){animation-delay:.8s;}
.social-icons a:nth-child(6){animation-delay:1s;}

.social-icons a:hover{
background:#00f2ff;
color:black;
transform:scale(1.2);
box-shadow:0 0 30px #00f2ff;
}

/* ================= FORM ================= */

.contact-form{
display:flex;
flex-direction:column;
gap:14px;
}

.contact-form input,
.contact-form textarea{
background:#0b0f1a;
border:1px solid transparent;
outline:none;
padding:12px 14px;
border-radius:10px;
color:white;
font-size:14px;
transition:.3s;
}

.contact-form input:focus,
.contact-form textarea:focus{
border:1px solid #00f2ff;
box-shadow:0 0 12px rgba(0,242,255,0.7);
}

.contact-form textarea{
height:120px;
resize:none;
}

.contact-form input::placeholder,
.contact-form textarea::placeholder{
color:#888;
}

/* Button */

.contact-form button{
margin-top:12px;
padding:12px;
border:none;
border-radius:30px;
background:linear-gradient(90deg,#00f2ff,#00ffd5,#00f2ff);
background-size:200%;
color:black;
font-weight:600;
cursor:pointer;
font-size:15px;
transition:.4s;
}

.contact-form button:hover{
background-position:right;
box-shadow:0 0 30px #00f2ff;
transform:translateY(-2px);
}

/* ================= FOOTER ================= */

footer{
background:#070b14;
padding:22px 10%;
text-align:center;
border-top:1px solid rgba(0,255,255,0.2);
}

footer p{
color:#aaa;
font-size:14px;
}

footer span{color:#00f2ff;}

/* ================= MOBILE ================= */

@media(max-width:768px){

.menu-toggle{display:block;}

.nav-links{
position:absolute;
top:65px;
right:0;
background:#0b0f1a;
width:220px;
flex-direction:column;
padding:20px;
gap:15px;
display:none;
}

.nav-links.active{
display:flex;
}

.contact-box{
padding:30px 22px;
}

.contact-box h1{
font-size:26px;
}

}

</style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<header>
<nav class="navbar">

<div class="logo">Sharath<span>Portfolio</span></div>

</nav>

<!-- ================= CONTACT ================= -->

<section class="contact-section">

<div class="contact-box">

<h1>Let’s Connect 🤝</h1>

<p>Whether it’s a new project, collaboration, or just to say hi — I’d love to hear from you.</p>

<div class="social-icons">
<a href="https://github.com/SharathKumarN8951"><i class="fab fa-github"></i></a>
<a href="https://www.linkedin.com/in/sharath-kumar-n-ai"><i class="fab fa-linkedin-in"></i></a>
<a href="#"><i class="fas fa-envelope"></i></a>
<a href="#"><i class="fab fa-whatsapp"></i></a>
<a href="https://www.instagram.com/sharath___gowda___07?utm_source=qr&igsh=MXA0cWxubTlsN3Vsbw=="><i class="fab fa-instagram"></i></a>
<a href="https://www.facebook.com/sharat.n.sharu"><i class="fab fa-facebook-f"></i></a>
</div>

<form class="contact-form"
      name="contact"
      method="POST"
      data-netlify="true">

<input type="hidden" name="form-name" value="contact">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<input type="text" name="subject" placeholder="Subject" required>

<textarea name="message" placeholder="Your Message..." required></textarea>

<button type="submit">🚀 Send Message</button>

</form>


</div>

</section>
