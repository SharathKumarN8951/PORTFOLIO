<head>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ================= VARIABLES ================= */

:root{
--bg:#05070d;
--card:#0c1220;
--glass:rgba(255,255,255,0.04);
--primary:#00f2ff;
--text:#e6f1ff;
--muted:#9fb2c7;
}

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:radial-gradient(circle at top,#0b1b3a,#05070d 60%);
color:var(--text);
opacity:0;
animation:pageFadeIn .6s ease forwards;
overflow-x:hidden;
}

@keyframes pageFadeIn{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

.page-exit{
animation:pageFadeOut .5s ease forwards;
}

@keyframes pageFadeOut{
to{opacity:0;transform:translateY(-15px);}
}

a{text-decoration:none;color:var(--text);}

/* ================= NAVBAR ================= */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 10%;
background:rgba(11,15,26,.85);
backdrop-filter:blur(10px);
position:fixed;
top:0;
left:0;
width:100%;
z-index:9999;
box-shadow:0 2px 15px rgba(0,0,0,0.6);
}

.logo{
font-size:22px;
font-weight:600;
}

.logo span{color:var(--primary);}

.nav-links{
list-style:none;
display:flex;
gap:26px;
}

.nav-links a{
position:relative;
}

.nav-links a::after{
content:"";
position:absolute;
width:0;
height:2px;
background:var(--primary);
left:0;
bottom:-6px;
transition:.3s;
}

.nav-links a:hover::after{
width:100%;
}

.menu-toggle{
display:none;
font-size:26px;
color:var(--primary);
cursor:pointer;
}

/* ================= GALLERY ================= */

.gallery-section{
padding:120px 10% 90px;
text-align:center;
}

.gallery-section h1{
font-size:42px;
margin-bottom:18px;
}

/* FILTERS */

.filter-btns{
display:flex;
justify-content:center;
gap:16px;
margin-bottom:60px;
flex-wrap:wrap;
}

.filter-btns button{
padding:9px 26px;
border-radius:30px;
border:1px solid var(--primary);
background:transparent;
color:var(--primary);
cursor:pointer;
transition:.3s;
}

.filter-btns button.active,
.filter-btns button:hover{
background:var(--primary);
color:#000;
}

/* GRID */

.gallery-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
gap:40px;
}

/* CARD */

.gallery-card{
background:linear-gradient(180deg,#0c152a,#070c18);
border-radius:18px;
padding:22px;
text-align:left;
box-shadow:0 0 25px rgba(0,242,255,.12);
transition:.5s;
display:none;
}

.gallery-card:hover{
transform:translateY(-12px);
box-shadow:0 0 45px rgba(0,242,255,.45);
}

.gallery-card h3{
color:var(--primary);
font-size:16px;
margin-bottom:14px;
}

/* IMAGE GRID */

.gallery-images{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
}

/* IMAGES */

.gallery-images img{
width:100%;
height:auto;
object-fit:contain;
border-radius:14px;
background:#000;
cursor:pointer;
transition:.5s;
}

.gallery-images img:hover{
transform:scale(1.08);
box-shadow:0 0 20px rgba(0,242,255,.7);
}

/* ================= LIGHTBOX ================= */

#lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.92);
display:none;
align-items:center;
justify-content:center;
z-index:2000;
}

#lightbox img{
max-width:92%;
max-height:92%;
border-radius:12px;
box-shadow:0 0 45px rgba(0,242,255,.8);
}

#lightbox .close{
position:absolute;
top:20px;
right:30px;
font-size:40px;
color:var(--primary);
cursor:pointer;
}

/* ================= FOOTER ================= */

footer{
margin-top:100px;
padding:26px 10%;
background:#060b15;
text-align:center;
border-top:1px solid rgba(0,242,255,.15);
}

footer p{
color:var(--muted);
font-size:14px;
}

footer span{color:var(--primary);}

/* ================= MOBILE ================= */

@media(max-width:768px){

.menu-toggle{display:block;}

.nav-links{
position:absolute;
top:70px;
right:0;
background:#0b0f1a;
width:230px;
flex-direction:column;
padding:22px;
display:none;
gap:16px;
}

.nav-links.active{
display:flex;
}

.gallery-section{
padding:90px 6%;
}

.gallery-section h1{
font-size:34px;
}

}

/* ================= ANIMATION ================= */

@keyframes fadeUp{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<div class="logo">Sharath<span>Portfolio</span></div>

<p>© 2026 <span>Sharath Kumar N</span> | All Rights Reserved</p>

<script>

/* Toggle Menu */
function toggleMenu(){
document.getElementById("navLinks").classList.toggle("active");
}

/* Filter Gallery */
function filterGallery(category,btn){

let cards=document.querySelectorAll(".gallery-card");
let buttons=document.querySelectorAll(".filter-btns button");

buttons.forEach(b=>b.classList.remove("active"));
btn.classList.add("active");

cards.forEach(card=>{
card.style.display = card.classList.contains(category) ? "block" : "none";
});

}

/* Default show personal */
window.onload=function(){
document.querySelector(".filter-btns button").click();
}

/* Lightbox */
function openLightbox(src){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=src;
document.body.style.overflow="hidden";
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
document.body.style.overflow="auto";
}

/* ESC Close */
document.addEventListener("keydown",e=>{
if(e.key==="Escape") closeLightbox();
});

/* Page Transition */
document.querySelectorAll("a").forEach(link=>{
link.addEventListener("click",function(e){
if(this.target==="_blank") return;
e.preventDefault();
const url=this.href;
document.body.classList.add("page-exit");
setTimeout(()=>{window.location.href=url;},500);
});
});

</script>
