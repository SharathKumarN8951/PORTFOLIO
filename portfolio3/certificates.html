<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates | Sharath Kumar</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- FontAwesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* ================= VARIABLES ================= */

:root{
--bg:#05070d;
--glass:rgba(255,255,255,0.04);
--card:#0c1220;
--primary:#00f2ff;
--text:#e6f1ff;
--muted:#9fb2c7;
}

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

body{
background:radial-gradient(circle at top,#0b1b3a,#05070d 60%);
color:var(--text);
opacity:0;
animation:pageFadeIn .6s ease forwards;
}

@keyframes pageFadeIn{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

.page-exit{
animation:pageFadeOut .5s ease forwards;
}

@keyframes pageFadeOut{
to{opacity:0;transform:translateY(-15px);}
}

a{text-decoration:none;color:var(--text);}

/* ================= NAVBAR ================= */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 10%;
background:rgba(11,15,26,.85);
backdrop-filter:blur(10px);
position:fixed;
top:0;
left:0;
width:100%;
z-index:9999;
box-shadow:0 2px 12px rgba(0,0,0,0.6);
}

.logo{
font-size:22px;
font-weight:600;
}
.logo span{color:var(--primary);}

.nav-links{
list-style:none;
display:flex;
gap:25px;
}

.nav-links a{
position:relative;
}

.nav-links a::after{
content:"";
position:absolute;
width:0;
height:2px;
background:var(--primary);
left:0;
bottom:-6px;
transition:.3s;
}

.nav-links a:hover::after{
width:100%;
}

.menu-toggle{
display:none;
font-size:26px;
color:var(--primary);
cursor:pointer;
}

/* ================= CERTIFICATES ================= */

.cert-section{
padding:120px 10% 90px;
}

.cert-header h1{
font-size:42px;
}

.cert-header p{
color:var(--muted);
margin-top:6px;
}

/* FILTERS */

.cert-filters{
margin-top:25px;
display:flex;
gap:14px;
flex-wrap:wrap;
}

.cert-filters button{
padding:9px 22px;
border-radius:30px;
border:1px solid var(--primary);
background:transparent;
color:var(--primary);
cursor:pointer;
transition:.3s;
}

.cert-filters button.active,
.cert-filters button:hover{
background:var(--primary);
color:#000;
}

/* GRID */

.cert-grid{
margin-top:60px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:35px;
}

/* CARD */

.cert-card{
background:linear-gradient(180deg,#0c152a,#070c18);
border-radius:18px;
padding:18px;
border:1px solid rgba(0,242,255,.18);
box-shadow:0 0 25px rgba(0,242,255,.08);
transition:.5s;
animation:fadeUp .7s ease forwards;
}

.cert-card:hover{
transform:translateY(-12px);
box-shadow:0 0 45px rgba(0,242,255,.45);
}

/* IMAGE */

.cert-card img{
width:100%;
height:170px;
object-fit:cover;
border-radius:12px;
margin-bottom:14px;
transition:.5s;
}

.cert-card:hover img{
transform:scale(1.08);
}

/* CONTENT */

.cert-card h3{
font-size:16px;
margin-bottom:6px;
}

.cert-card p{
font-size:13px;
color:var(--muted);
margin-bottom:14px;
}

/* BUTTON */

.cert-card a{
display:inline-block;
padding:7px 20px;
border-radius:25px;
background:linear-gradient(135deg,#00f2ff,#00bcd4);
color:#000;
font-size:13px;
font-weight:600;
transition:.3s;
}

.cert-card a:hover{
box-shadow:0 0 20px var(--primary);
}

/* ================= FOOTER ================= */

footer{
margin-top:100px;
padding:26px 10%;
background:#060b15;
text-align:center;
border-top:1px solid rgba(0,242,255,.15);
}

footer p{
color:var(--muted);
font-size:14px;
}

footer span{color:var(--primary);}

/* ================= MOBILE ================= */

@media(max-width:768px){

.menu-toggle{display:block;}

.nav-links{
position:absolute;
top:70px;
right:0;
background:#0b0f1a;
width:220px;
flex-direction:column;
padding:22px;
display:none;
gap:16px;
}

.nav-links.active{
display:flex;
}

.cert-section{
padding:90px 6%;
}

.cert-header h1{
font-size:34px;
}

}

/* ================= ANIMATION ================= */

@keyframes fadeUp{
from{opacity:0;transform:translateY(30px);}
to{opacity:1;transform:translateY(0);}
}

</style>
</head>

<body>

<header>
<nav class="navbar">

<div class="logo">Sharath<span>Portfolio</span></div>

<ul class="nav-links" id="navLinks">
<li><a href="index.html">Home</a></li>
<li><a href="about.html">About</a></li>
<li><a href="projects.html">Projects</a></li>
<li><a href="certificates.html">Certificates</a></li>
<li><a href="gallery.html">Gallery</a></li>
<li><a href="skills.html">Skills</a></li>
<li><a href="resume.html">Resume</a></li>
<li><a href="blog.html">Blog</a></li>
<li><a href="contact.html">Contact</a></li>
</ul>

<div class="menu-toggle" onclick="toggleMenu()">
<i class="fas fa-bars"></i>
</div>

</nav>
</header>

<section class="cert-section">

<div class="cert-header">
<h1>🏅 Certificates</h1>
<p>Explore my certifications — technical & others.</p>

<div class="cert-filters">
<button class="active" onclick="filterCert('all')">All</button>
<button onclick="filterCert('tech')">Tech</button>

</div>

</section>

<footer>
<p>© 2026 <span>Sharath Kumar N</span> | All Rights Reserved</p>
</footer>

<script>

/* Toggle Menu */
function toggleMenu(){
document.getElementById("navLinks").classList.toggle("active");
}

/* Filter Certificates */
function filterCert(type){

let cards=document.querySelectorAll(".cert-card");
let buttons=document.querySelectorAll(".cert-filters button");

buttons.forEach(btn=>btn.classList.remove("active"));
event.target.classList.add("active");

cards.forEach(card=>{

if(type==="all"){
card.style.display="block";
}
else if(card.classList.contains(type)){
card.style.display="block";
}
else{
card.style.display="none";
}

});

}

/* Page Transition */
document.querySelectorAll("a").forEach(link=>{
link.addEventListener("click",function(e){
if(this.target==="_blank") return;
e.preventDefault();
const url=this.href;
document.body.classList.add("page-exit");
setTimeout(()=>{window.location.href=url;},500);
});
});

</script>

</body>
</html>
