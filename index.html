<style>

/* ================= RESET ================= */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins, sans-serif;
scroll-behavior:smooth;
}

body{
background:linear-gradient(-45deg,#07152c,#02040b,#0b1d3a,#020409);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
color:white;
overflow-x:hidden;
opacity:0;
animation:pageFadeIn .6s ease forwards, bgMove 15s ease infinite;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

a{text-decoration:none;color:white;}

/* ================= NAVBAR ================= */

.navbar{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 10%;
background:rgba(11,15,26,0.8);
backdrop-filter:blur(10px);
position:fixed;
top:0;
left:0;
width:100%;
z-index:9999;
transition:.3s;
}

.logo{
font-size:22px;
font-weight:600;
}

.logo span{color:#00f2ff;}

.nav-links{
list-style:none;
display:flex;
gap:25px;
}

.nav-links a{
transition:.3s;
}

.nav-links a:hover{
color:#00f2ff;
}

.menu-toggle{
display:none;
font-size:28px;
cursor:pointer;
color:#00f2ff;
}

/* ================= HERO ================= */

.hero{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
gap:80px;
padding:120px 8% 60px;
flex-wrap:wrap;
}

/* IMAGE */

.hero-img{
position:relative;
width:260px;
height:260px;
display:flex;
align-items:center;
justify-content:center;
}

.hero-img::before{
content:"";
position:absolute;
width:280px;
height:280px;
border-radius:50%;
border:3px dashed #00f2ff;
animation:ringRotate 12s linear infinite;
}

.hero-img::after{
content:"";
position:absolute;
width:280px;
height:280px;
border-radius:50%;
box-shadow:0 0 60px #00f2ff;
}

.hero-img img{
width:250px;
height:250px;
border-radius:50%;
object-fit:cover;
border:6px solid #02040b;
object-fit:cover;
object-position:center top;
}

@keyframes ringRotate{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

/* CONTENT */

.hero-content{
max-width:550px;
}

.hero-content h1{
font-size:42px;
margin-bottom:10px;
}

.hero-content span{
color:#00f2ff;
}

.typing-text{
font-size:20px;
color:#ccc;
margin-bottom:25px;
min-height:28px;
}

.cursor{
color:#00f2ff;
animation:blink 1s infinite;
}

@keyframes blink{
0%,50%,100%{opacity:1;}
25%,75%{opacity:0;}
}

/* BADGES */

.badges{
display:flex;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
}

.badge{
padding:8px 16px;
border:1px solid #00f2ff;
border-radius:20px;
color:#00f2ff;
font-size:14px;
transition:0.3s;
}

.badge:hover{
background:#00f2ff;
color:black;
}

/* BUTTONS */

.hero-buttons{
display:flex;
gap:15px;
margin-bottom:25px;
flex-wrap:wrap;
}

.btn{
padding:12px 26px;
border-radius:25px;
background:#00f2ff;
color:black;
font-weight:600;
transition:0.3s;
position:relative;
overflow:hidden;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 20px #00f2ff;
}

.btn-outline{
padding:12px 26px;
border-radius:25px;
border:2px solid #00f2ff;
color:#00f2ff;
transition:0.3s;
}

.btn-outline:hover{
background:#00f2ff;
color:black;
}

/* SOCIAL */

.social-icons{
display:flex;
gap:15px;
}

.social-icons a{
width:40px;
height:40px;
border-radius:50%;
border:1px solid #00f2ff;
display:flex;
align-items:center;
justify-content:center;
transition:0.3s;
}

.social-icons a:hover{
background:#00f2ff;
color:black;
transform:translateY(-5px);
}

/* ================= FOOTER ================= */

.footer{
background:#04070d;
padding:40px 10%;
text-align:center;
margin-top:60px;
border-top:1px solid rgba(0,255,255,0.2);
}

.footer span{color:#00f2ff;}

/* ================= MOBILE ================= */

@media(max-width:900px){

.hero{
flex-direction:column;
text-align:center;
}

.nav-links{
position:absolute;
top:70px;
right:0;
background:#111;
flex-direction:column;
width:200px;
padding:20px;
display:none;
}

.nav-links.active{
display:flex;
}

.menu-toggle{
display:block;
}

}

/* ================= PAGE TRANSITION ================= */

@keyframes pageFadeIn{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

.page-exit{
animation:pageFadeOut .5s ease forwards;
}

@keyframes pageFadeOut{
to{
opacity:0;
transform:translateY(-15px);
}
}
/* ================= HERO RESPONSIVE FIX ================= */

/* Tablets */
@media (max-width: 992px){

  .hero{
    padding:120px 6% 60px;
  }

  .hero h1{
    font-size:42px;
  }

  .hero h2,
  .hero span{
    font-size:24px;
  }

  .hero p{
    font-size:15px;
  }

}

/* Mobile */
@media (max-width: 600px){

  .hero{
    padding:110px 5% 50px;
    text-align:center;
    align-items:center;
  }

  .hero h1{
    font-size:34px;
  }

  .hero h2,
  .hero span{
    font-size:20px;
  }

  .hero p{
    font-size:14px;
  }

  .hero .buttons{
    flex-direction:column;
    width:100%;
    gap:14px;
  }

  .hero .buttons a{
    width:100%;
    max-width:260px;
    text-align:center;
  }

  .hero .skills{
    justify-content:center;
    gap:10px;
  }

}

/* Very Small Phones */
@media (max-width: 400px){

  .hero h1{
    font-size:28px;
  }

  .hero h2,
  .hero span{
    font-size:18px;
  }

}
/* ================= MOBILE RESPONSIVE PATCH ONLY ================= */

@media (max-width: 768px){

  /* HERO LAYOUT */
  .hero{
    flex-direction:column;
    gap:40px;
    padding:110px 6% 50px;
    text-align:center;
  }

  /* IMAGE */
  .hero-img{
    width:200px;
    height:200px;
  }

  .hero-img::before,
  .hero-img::after{
    width:220px;
    height:220px;
  }

  .hero-img img{
    width:190px;
    height:190px;
  }

  /* TEXT */
  .hero-content h1{
    font-size:30px;
  }

  .typing-text{
    font-size:16px;
  }

  /* BADGES */
  .badges{
    justify-content:center;
  }

  .badge{
    font-size:13px;
    padding:6px 14px;
  }

  /* BUTTONS */
  .hero-buttons{
    flex-direction:column;
    align-items:center;
  }

  .hero-buttons a{
    width:100%;
    max-width:260px;
    text-align:center;
  }

  /* SOCIAL ICONS */
  .social-icons{
    justify-content:center;
  }

}


/* VERY SMALL PHONES */
@media (max-width: 420px){

  .hero-content h1{
    font-size:26px;
  }

  .typing-text{
    font-size:14px;
  }

  .badge{
    font-size:12px;
  }

}

</style>

<script>

/* Typing Effect */
const texts=[
"Full Stack Developer",
"Data Science Enthusiast",
"AI Explorer",
"Machine Learning Engineer"
];

let index=0,char=0;
let typing=document.getElementById("typing");

function type(){
if(char<texts[index].length){
typing.textContent+=texts[index].charAt(char);
char++;
setTimeout(type,80);
}else setTimeout(erase,1500);
}

function erase(){
if(char>0){
typing.textContent=texts[index].substring(0,char-1);
char--;
setTimeout(erase,40);
}else{
index=(index+1)%texts.length;
setTimeout(type,200);
}
}

document.addEventListener("DOMContentLoaded",type);

/* Toggle */
function toggleMenu(){
document.getElementById("navLinks").classList.toggle("active");
}

/* Page Transition */
document.querySelectorAll("a").forEach(link=>{
link.addEventListener("click",function(e){
if(this.target==="_blank") return;
e.preventDefault();
const url=this.href;
document.body.classList.add("page-exit");
setTimeout(()=>{window.location.href=url;},500);
});
});

</script>
